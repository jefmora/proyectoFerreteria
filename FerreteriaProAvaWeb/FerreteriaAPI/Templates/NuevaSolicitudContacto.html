<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva solicitud de contacto</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; background-color:#f4f4f7; margin:0; padding:30px 0;">

    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center">

                <table width="600" cellpadding="0" cellspacing="0"
                       style="background-color:#ffffff; border-radius:8px; overflow:hidden;">

                    <tr>
                        <td style="background-color:#66696E; padding:25px; text-align:center;">
                            <h1 style="color:#ffffff; margin:0;">
                                Nueva solicitud de contacto
                            </h1>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:30px; color:#333333;">

                            <p>
                                Se recibió una nueva solicitud de contacto.
                            </p>

                            <p>
                                <strong>Nombre:</strong> {{NOMBRE}}<br>
                                <strong>Correo:</strong> {{CORREO}}<br>
                                <strong>Teléfono:</strong> {{TELEFONO}}<br>
                                <strong>Asunto:</strong> {{ASUNTO}}
                            </p>

                            <hr>

                            <p>
                                <strong>Mensaje:</strong>
                            </p>

                            <p>
                                {{MENSAJE}}
                            </p>

                        </td>
                    </tr>

                    <tr>
                        <td style="background-color:#f4f4f7; padding:15px; text-align:center;">
                            <small style="color:#777777;">
                                Ferretería ProAva
                            </small>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
